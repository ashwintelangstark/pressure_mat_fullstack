{% load static %}
<!DOCTYPE html>
<html>
<head>

    {% load static %}

    <title>Pressure Visualization System - Add Patient</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Manrope', sans-serif;
            background: #FAF6F0;
            background-image: radial-gradient(circle at 10% 20%, rgba(254, 243, 199, 0.8) 0%, rgba(250, 246, 240, 1) 90%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #261705;
        }

        .form-container {
            background-color: #ffffff;
            padding: 40px 45px;
            border-radius: 24px;
            box-shadow: 0 20px 40px -10px rgba(245, 158, 11, 0.18), 0 6px 16px rgba(0, 0, 0, 0.03);
            border: 1px solid rgba(245, 158, 11, 0.25);
            width: 100%;
            max-width: 420px;
            animation: fadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        h1 {
            text-align: center;
            color: #261705;
            margin-bottom: 28px;
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        label {
            display: block;
            margin: 16px 0 6px;
            color: #78350F;
            font-weight: 700;
            font-size: 14px;
        }

        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #FEF3C7;
            border-radius: 12px;
            font-size: 15px;
            font-family: 'Manrope', sans-serif;
            transition: all 0.2s ease;
            background-color: #FAF6F0;
            color: #261705;
            box-sizing: border-box;
        }

        input[type="text"]:focus, input[type="number"]:focus {
            border-color: #F59E0B;
            outline: none;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.18);
        }

        button {
            margin-top: 26px;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #F59E0B, #D97706);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 700;
            font-family: 'Manrope', sans-serif;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(245, 158, 11, 0.35);
            transition: all 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 22px rgba(245, 158, 11, 0.45);
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #D97706;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .back-link:hover {
            color: #B45309;
            text-decoration: underline;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-12px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h1>Patient Registration</h1>
        <form method="POST">
            {% csrf_token %}
            <label>Name:</label>
            <input type="text" name="name" placeholder="Enter full name" required pattern="[A-Za-z ]+" oninput="this.value = this.value.replace(/[^A-Za-z ]/g, '')">

            <label>Patient ID:</label>
            <input type="number" name="patient_id" placeholder="Enter unique ID" required oninput="this.value = this.value.replace(/[^0-9]/g, '')">

            <button type="submit">Add Patient</button>
        </form>
        <a class="back-link" href="{% url 'home' %}">← Back to Dashboard</a>
    </div>
</body>
</html>
